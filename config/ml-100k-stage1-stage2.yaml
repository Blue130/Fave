# ML-100K configuration shared for Stage 1/2 as originally provided.
# The active mode is finetuning from the specified pretrained checkpoint.

# Dataset and runtime
dataset: ml-100k
log_file: log/
random_seed: 1997
max_len: 50
device: cuda
num_gpu: 1

# Model
batch_size: 512
hidden_size: 128
dropout: 0.1
emb_dropout: 0.3
hidden_act: gelu
num_blocks: 4
drop_path_rate: 0.2

# Optimization
epochs: 200
decay_step: 100
gamma: 0.1
metric_ks: [10, 20]
optimizer: Adam
lr: 0.001
weight_decay: 0
momentum: null
eval_interval: 1
patience: 10
finetune_lr_scale: 0.1
emb_lr_rate: 0.001

# Flow and sampling
lambda_uncertainty: 0.001
eps: 0.001
sample_N: 30
lambda_t: 0.001
dropout_c: 0.1
eps_reverse: 0.001
m_logNorm: 1.0
s_logNorm: 0.6
s_modsamp: 1.0
last: 2
mask_ratio: 1.0
sampling_method: mode

# Stage and checkpoint
stage_mode: finetune
ckpt_path: "./best for ml-100k copy/pretrain_best.pt"

# Objectives and masking
Loss_Alpha: 0.2
Loss_Beta: 0.4
loss_aux_weight: 0.5
loss_straight_weight: 0.1
train_mask_ratio: 0.5
infer_mask_ratio: 0.6
gamma_init: 0.01
mask_end: 0.75
loss_pretrain_weight: 0.3

